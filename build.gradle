plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// recipe viewers, only for the compatibility test runs (-PwithJei / -PwithRei)
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
	// Headless server tests (src/gametest) and client screenshot tests: ./gradlew runGameTest / runClientGameTest
	configureTests {
		createSourceSet = true
		modId = "tamagotchi-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings line: Minecraft 26.x ships unobfuscated.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// optional recipe-viewer plugins (src/main/java/.../compat); only compiled against, never bundled
	compileOnly "maven.modrinth:jei:31.16.0.87"
	compileOnly "maven.modrinth:rei:26.3.824+fabric"
	compileOnly "maven.modrinth:architectury-api:22.0.5+fabric"

	// ./gradlew runClientGameTest -PwithJei (or -PwithRei) loads the recipe viewer next to the mod
	if (project.hasProperty("withJei")) {
		localRuntime "maven.modrinth:jei:31.16.0.87"
	}
	if (project.hasProperty("withRei")) {
		localRuntime "maven.modrinth:rei:26.3.824+fabric"
		localRuntime "maven.modrinth:architectury-api:22.0.5+fabric"
		localRuntime "maven.modrinth:cloth-config:26.3.159+fabric"
	}
}

// Footage for the videos, frame by frame (src/film): ./gradlew runFilm -Pfilm=SCENE[,SCENE] -PfilmOut=DIR
sourceSets {
	film {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}
loom {
	mods {
		"tamagotchi-film" {
			sourceSet sourceSets.film
		}
	}
	runs {
		film {
			client()
			name "Film"
			source sourceSets.film
			runDir "build/run/film"
			property "fabric.client.gametest"
			property "fabric.client.gametest.testModResourcesPath", file("src/film/resources").absolutePath
			vmArg "-Xmx3G"
			if (project.hasProperty('film')) vmArg "-Dfilm.scene=${project.property('film')}"
			if (project.hasProperty('filmOut')) vmArg "-Dfilm.out=${project.property('filmOut')}"
		}
	}
}
tasks.matching { it.name == 'runFilm' }.configureEach {
	onlyIf { project.hasProperty('film') }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
