plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// recipe viewers, only for the compatibility test runs (-PwithJei / -PwithRei)
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
	// Headless server tests (src/gametest) and client screenshot tests: ./gradlew runGameTest / runClientGameTest
	configureTests {
		createSourceSet = true
		modId = "tamagotchi-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings line: Minecraft 26.x ships unobfuscated.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// optional recipe-viewer plugins (src/main/java/.../compat); only compiled against, never bundled
	compileOnly "maven.modrinth:jei:31.16.0.87"
	compileOnly "maven.modrinth:rei:26.3.824+fabric"
	compileOnly "maven.modrinth:architectury-api:22.0.5+fabric"

	// ./gradlew runClientGameTest -PwithJei (or -PwithRei) loads the recipe viewer next to the mod
	if (project.hasProperty("withJei")) {
		localRuntime "maven.modrinth:jei:31.16.0.87"
	}
	if (project.hasProperty("withRei")) {
		localRuntime "maven.modrinth:rei:26.3.824+fabric"
		localRuntime "maven.modrinth:architectury-api:22.0.5+fabric"
		localRuntime "maven.modrinth:cloth-config:26.3.159+fabric"
	}
}

// Footage for the videos, frame by frame (src/film): ./gradlew runFilm -Pfilm=SCENE[,SCENE] -PfilmOut=DIR
sourceSets {
	film {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}
loom {
	mods {
		"tamagotchi-film" {
			sourceSet sourceSets.film
		}
	}
	runs {
		film {
			client()
			name "Film"
			source sourceSets.film
			runDir "build/run/film"
			property "fabric.client.gametest"
			property "fabric.client.gametest.testModResourcesPath", file("src/film/resources").absolutePath
			vmArg "-Xmx3G"
			if (project.hasProperty('film')) vmArg "-Dfilm.scene=${project.property('film')}"
			if (project.hasProperty('filmOut')) vmArg "-Dfilm.out=${project.property('filmOut')}"
		}
	}
}
// ./gradlew runClientGameTest -Ptests=blocks (or pets) runs only that part of the client tests
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
	if (project.hasProperty('tests')) jvmArgs "-Dtama.tests=${project.property('tests')}"
}
tasks.matching { it.name == 'runFilm' }.configureEach {
	onlyIf { project.hasProperty('film') }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// Releases (see README "Releasing"): pushing the tag v<mod_version> runs .github/workflows/release.yml, which uploads
// the jar to CurseForge, Modrinth and a GitHub release, with that version's section of CHANGELOG.md as changelog.
// Without tokens or project ids (local runs, the build workflow) it is a dry run that only writes build/publishMods.
def changelogFor = { String v ->
	def text = file("CHANGELOG.md").text
	def m = (text =~ /(?ms)^## \[?${java.util.regex.Pattern.quote(v)}\]?[^\n]*\n(.*?)(?=^## |\z)/)
	m.find() ? m.group(1).trim() : "Tamagotchi ${v}"
}
def curseforgeId = providers.gradleProperty("curseforge_id").getOrElse("")
def modrinthId = providers.gradleProperty("modrinth_id").getOrElse("")
// A platform is published to when its project id and token are there (a missing GitHub secret is an empty string);
// a dry run (PUBLISH_DRY_RUN=true, every push in CI) checks all three with stand-in ids.
def secret = { String name -> providers.environmentVariable(name).getOrElse("").trim() }
def isDryRun = providers.environmentVariable("PUBLISH_DRY_RUN").getOrElse("false") == "true"
def toCurseforge = isDryRun || !curseforgeId.isEmpty() && !secret("CURSEFORGE_TOKEN").isEmpty()
def toModrinth = isDryRun || !modrinthId.isEmpty() && !secret("MODRINTH_TOKEN").isEmpty()
def toGithub = isDryRun || !secret("GITHUB_TOKEN").isEmpty()
publishMods {
	file = jar.archiveFile
	changelog = changelogFor(project.version.toString())
	type = STABLE
	displayName = "Tamagotchi ${project.version}"
	modLoaders.add("fabric")
	dryRun = isDryRun

	if (toCurseforge) {
		curseforge {
			projectId = curseforgeId.isEmpty() ? "0" : curseforgeId
			accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
			minecraftVersions.add(project.minecraft_version)
			client = true
			server = true
			requires("fabric-api")
		}
	}
	if (toModrinth) {
		modrinth {
			projectId = modrinthId.isEmpty() ? "AAAAAAAA" : modrinthId
			accessToken = providers.environmentVariable("MODRINTH_TOKEN")
			minecraftVersions.add(project.minecraft_version)
			requires("fabric-api")
		}
	}
	if (toGithub) {
		github {
			repository = "Kasax007/Tamagotchi"
			accessToken = providers.environmentVariable("GITHUB_TOKEN")
			commitish = providers.environmentVariable("GITHUB_SHA").orElse("26.3")
			tagName = "v${project.version}"
		}
	}
}
