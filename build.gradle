plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// recipe viewers, only for the compatibility test runs (-PwithJei / -PwithRei)
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.1 is obfuscated: official Mojang names, so the code reads like the 26.x branch
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// optional recipe-viewer plugins (src/main/java/.../compat); only compiled against, never bundled
	modCompileOnly "maven.modrinth:jei:${project.jei_version}"
	modCompileOnly "maven.modrinth:rei:${project.rei_version}"
	modCompileOnly "maven.modrinth:architectury-api:${project.architectury_version}"

	// ./gradlew runClientGameTest -PwithJei (or -PwithRei) loads the recipe viewer next to the mod
	if (project.hasProperty("withJei")) {
		modLocalRuntime "maven.modrinth:jei:${project.jei_version}"
	}
	if (project.hasProperty("withRei")) {
		modLocalRuntime "maven.modrinth:rei:${project.rei_version}"
		modLocalRuntime "maven.modrinth:architectury-api:${project.architectury_version}"
		modLocalRuntime "maven.modrinth:cloth-config:${project.cloth_version}"
	}
}

// Client self-test (src/gametest): Minecraft 1.21.1 has no Fabric client game-test API yet, so the tests bring their own
// small harness (net.kasax.tamagotchi.test.harness). Run: xvfb-run -a ./gradlew runClientGameTest [-Ptests=checks|blocks|pets]
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}
loom {
	accessWidenerPath = file("src/main/resources/tamagotchi.accesswidener")
	mods {
		"tamagotchi" {
			sourceSet sourceSets.main
		}
		"tamagotchi-gametest" {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		clientGameTest {
			client()
			name "Client Game Test"
			source sourceSets.gametest
			runDir "build/run/clientGameTest"
			property "tama.selftest", "true"
			vmArg "-Xmx2G"
		}
	}
}
// ./gradlew runClientGameTest -Ptests=blocks (or pets) runs only that part of the client tests;
// -Ptests=checks runs only the functional pet checks and real-click tests (no screenshots); combine: -Ptests=blocks,checks
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
	if (project.hasProperty('tests')) jvmArgs "-Dtama.tests=${project.property('tests')}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// Releases (see README "Releasing"): pushing the tag v<mod_version> runs .github/workflows/release.yml, which uploads
// the jar to CurseForge, Modrinth and a GitHub release, with that version's section of CHANGELOG.md as changelog.
// Without tokens or project ids (local runs, the build workflow) it is a dry run that only writes build/publishMods.
def changelogFor = { String v ->
	def text = file("CHANGELOG.md").text
	def m = (text =~ /(?ms)^## \[?${java.util.regex.Pattern.quote(v)}\]?[^\n]*\n(.*?)(?=^## |\z)/)
	m.find() ? m.group(1).trim() : "Tamagotchi ${v}"
}
def curseforgeId = providers.gradleProperty("curseforge_id").getOrElse("")
def modrinthId = providers.gradleProperty("modrinth_id").getOrElse("")
// A platform is published to when its project id and token are there (a missing GitHub secret is an empty string);
// a dry run (PUBLISH_DRY_RUN=true, every push in CI) checks all three with stand-in ids.
def secret = { String name -> providers.environmentVariable(name).getOrElse("").trim() }
def isDryRun = providers.environmentVariable("PUBLISH_DRY_RUN").getOrElse("false") == "true"
def toCurseforge = isDryRun || !curseforgeId.isEmpty() && !secret("CURSEFORGE_TOKEN").isEmpty()
def toModrinth = isDryRun || !modrinthId.isEmpty() && !secret("MODRINTH_TOKEN").isEmpty()
def toGithub = isDryRun || !secret("GITHUB_TOKEN").isEmpty()
publishMods {
	file = jar.archiveFile
	changelog = changelogFor(project.version.toString())
	type = STABLE
	displayName = "Tamagotchi ${project.version}"
	modLoaders.add("fabric")
	dryRun = isDryRun

	if (toCurseforge) {
		curseforge {
			projectId = curseforgeId.isEmpty() ? "0" : curseforgeId
			accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
			minecraftVersions.add(project.minecraft_version)
			client = true
			server = true
			requires("fabric-api")
		}
	}
	if (toModrinth) {
		modrinth {
			projectId = modrinthId.isEmpty() ? "AAAAAAAA" : modrinthId
			accessToken = providers.environmentVariable("MODRINTH_TOKEN")
			minecraftVersions.add(project.minecraft_version)
			requires("fabric-api")
		}
	}
	if (toGithub) {
		github {
			repository = "Kasax007/Tamagotchi"
			accessToken = providers.environmentVariable("GITHUB_TOKEN")
			commitish = providers.environmentVariable("GITHUB_SHA").orElse("port/1.21.1")
			tagName = "v${project.version}"
		}
	}
}
