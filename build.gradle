plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version "${moddev_version}"
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// recipe viewers (compile only; loaded only for the compatibility test runs -PwithJei / -PwithRei)
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

// Tests (src/gametest, a second mod that is never shipped):
// - the client self-test (the same tests as the Fabric build's client game tests, on a small harness with the names of
//   Fabric's client game-test API: net.kasax.tamacraft.test.harness). Run: xvfb-run -a ./gradlew runClientGameTest
//   [-Ptests=checks|blocks|pets]
// - the server game tests (net.kasax.tamacraft.test.ServerTests): ./gradlew runGameTestServer
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

neoForge {
	version = project.neo_version

	mods {
		tamacraft {
			sourceSet sourceSets.main
		}
		tamacraft_gametest {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		client {
			client()
		}
		server {
			server()
		}
		clientGameTest {
			client()
			sourceSet = sourceSets.gametest
			loadedMods = [mods.tamacraft, mods.tamacraft_gametest]
			gameDirectory = file("build/run/clientGameTest")
			systemProperty "tama.selftest", "true"
			if (project.hasProperty("tests")) systemProperty "tama.tests", project.property("tests").toString()
			jvmArgument "-Xmx2G"
			programArguments.addAll("--username", "TamaTester")
		}
		gameTestServer {
			type = "gameTestServer"
			sourceSet = sourceSets.gametest
			loadedMods = [mods.tamacraft, mods.tamacraft_gametest]
			gameDirectory = file("build/run/gameTestServer")
			systemProperty "neoforge.enabledGameTestNamespaces", "tamacraft_gametest"
			jvmArgument "-Xmx2G"
		}
		// Writes the mod's registry ids, data and tags to a file and stops (for the comparison with the Fabric build):
		// ./gradlew runRegistryDump -PdumpTo=/path/file.txt
		registryDump {
			server()
			sourceSet = sourceSets.gametest
			loadedMods = [mods.tamacraft, mods.tamacraft_gametest]
			gameDirectory = file("build/run/registryDump")
			systemProperty "tama.dump", (project.findProperty("dumpTo") ?: file("build/registry-dump.txt").absolutePath).toString()
			programArguments.add("--nogui")
		}
	}
}

dependencies {
	compileOnly "maven.modrinth:jei:${project.jei_version}"
	compileOnly "maven.modrinth:rei:${project.rei_version}"
	compileOnly "maven.modrinth:architectury-api:${project.architectury_version}"
	// ./gradlew runClientGameTest -PwithJei (or -PwithRei) loads the recipe viewer next to the mod
	if (project.hasProperty("withJei")) {
		gametestRuntimeOnly "maven.modrinth:jei:${project.jei_version}"
	}
	if (project.hasProperty("withRei")) {
		gametestRuntimeOnly "maven.modrinth:rei:${project.rei_version}"
		gametestRuntimeOnly "maven.modrinth:architectury-api:${project.architectury_version}"
		gametestRuntimeOnly "maven.modrinth:cloth-config:${project.cloth_version}"
	}
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [mod_version: project.mod_version, minecraft_version: project.minecraft_version, neo_version: project.neo_version]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// A clean game for every client self-test: no onboarding screens, no pause when the window loses focus.
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	doFirst {
		def dir = file("build/run/clientGameTest")
		dir.mkdirs()
		file("build/run/clientGameTest/options.txt").text = "onboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\n" +
				"joinedFirstServer:true\nskipMultiplayerWarning:true\nnarrator:0\nsoundCategory_master:0.0\n"
		delete "build/run/clientGameTest/saves", "build/run/clientGameTest/screenshots"
	}
}
tasks.matching { it.name == "runGameTestServer" || it.name == "runRegistryDump" }.configureEach {
	doFirst {
		def dir = file("build/run/${it.name == 'runGameTestServer' ? 'gameTestServer' : 'registryDump'}")
		dir.mkdirs()
		new File(dir, "eula.txt").text = "eula=true\n"
		delete new File(dir, "world"), new File(dir, "gametestworld")
	}
}

// Releases (see README "Releasing"): pushing the tag v<mod_version> runs .github/workflows/release.yml, which uploads
// the jar to CurseForge, Modrinth and a GitHub release, with that version's section of CHANGELOG.md as changelog.
// Without tokens or project ids (local runs, the build workflow) it is a dry run that only writes build/publishMods.
def changelogFor = { String v ->
	def text = file("CHANGELOG.md").text
	def m = (text =~ /(?ms)^## \[?${java.util.regex.Pattern.quote(v)}\]?[^\n]*\n(.*?)(?=^## |\z)/)
	m.find() ? m.group(1).trim() : "Tamacraft ${v}"
}
def curseforgeId = providers.gradleProperty("curseforge_id").getOrElse("")
def modrinthId = providers.gradleProperty("modrinth_id").getOrElse("")
// A platform is published to when its project id and token are there (a missing GitHub secret is an empty string);
// a dry run (PUBLISH_DRY_RUN=true, every push in CI) checks all three with stand-in ids.
def secret = { String name -> providers.environmentVariable(name).getOrElse("").trim() }
def isDryRun = providers.environmentVariable("PUBLISH_DRY_RUN").getOrElse("false") == "true"
def toCurseforge = isDryRun || !curseforgeId.isEmpty() && !secret("CURSEFORGE_TOKEN").isEmpty()
def toModrinth = isDryRun || !modrinthId.isEmpty() && !secret("MODRINTH_TOKEN").isEmpty()
def toGithub = isDryRun || !secret("GITHUB_TOKEN").isEmpty()
publishMods {
	file = jar.archiveFile
	changelog = changelogFor(project.version.toString())
	type = STABLE
	displayName = "Tamacraft ${project.version}"
	modLoaders.add("neoforge")
	dryRun = isDryRun

	if (toCurseforge) {
		curseforge {
			projectId = curseforgeId.isEmpty() ? "0" : curseforgeId
			accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
			minecraftVersions.add(project.minecraft_version)
			client = true
			server = true
		}
	}
	if (toModrinth) {
		modrinth {
			projectId = modrinthId.isEmpty() ? "AAAAAAAA" : modrinthId
			accessToken = providers.environmentVariable("MODRINTH_TOKEN")
			minecraftVersions.add(project.minecraft_version)
		}
	}
	if (toGithub) {
		github {
			repository = "Kasax007/tamacraft"
			accessToken = providers.environmentVariable("GITHUB_TOKEN")
			commitish = providers.environmentVariable("GITHUB_SHA").orElse("port/26.3-neoforge")
			tagName = "v${project.version}"
		}
	}
}
