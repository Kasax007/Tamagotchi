# Pushing the tag v<mod_version> (for example v1.0.0), or starting this workflow by hand on the branch ("Run workflow"
# in the Actions tab), builds the mod and publishes mod_version: a GitHub release (the tag is made if it is missing),
# CurseForge when the secret CURSEFORGE_TOKEN is set, Modrinth when MODRINTH_TOKEN and modrinth_id are set.
# See README "Releasing".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match mod_version
        if: github.event_name == 'push'
        run: |
          v=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version $v in gradle.properties"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and publish
        run: ./gradlew build publishMods --stacktrace
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: tamagotchi-release
          path: build/libs/*.jar
