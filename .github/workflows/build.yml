# Every push: build the mod and run the release in dry-run mode, so a broken release setup shows up before a tag does.
name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and dry-run the release
        run: ./gradlew build publishMods --stacktrace
        env:
          PUBLISH_DRY_RUN: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: tamagotchi-jar
          path: |
            build/libs/*.jar
            build/publishMods/
